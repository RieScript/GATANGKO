<style>
:root{
  --leaf:#1F7A3D; --leaf-2:#E3F1E6; --on-leaf:#FFFFFF;
  --tarp:#EE8A1F; --awn-alt:#FFF6E8;
  --board:#E4CB9C; --board-ink:#2B2117; --board-edge:#C4A266;
  --bg:#F4F6EF; --surface:#FFFFFF; --ink:#17201A; --muted:#56635A; --line:#DAE1D5;
  --danger:#B3261E;
  --b1:#1D5FC4; --b1t:#E4EDFB; --b2:#D23B33; --b2t:#FBE6E4; --b3:#C2457F; --b3t:#FBE7F0;
  --b4:#1F7A3D; --b4t:#E3F1E6; --b5:#E7811A; --b5t:#FDEFD9;
  --font:"Lexend", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --leaf:#55B874; --leaf-2:#1C3323; --on-leaf:#0C1810;
    --tarp:#F3A04A; --awn-alt:#E9DFCB;
    --board:#D8BC86; --board-ink:#231910; --board-edge:#A2834F;
    --bg:#0F1511; --surface:#18201B; --ink:#EAF0EA; --muted:#A0AEA5; --line:#2B362E;
    --danger:#F2B8B5;
    --b1:#7FA8EC; --b1t:#1C2940; --b2:#F0857F; --b2t:#3A1E1C; --b3:#F09AC2; --b3t:#3A1F2C;
    --b4:#55B874; --b4t:#1C3323; --b5:#F3A04A; --b5t:#3A2A15;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --leaf:#55B874; --leaf-2:#1C3323; --on-leaf:#0C1810;
  --tarp:#F3A04A; --awn-alt:#E9DFCB;
  --board:#D8BC86; --board-ink:#231910; --board-edge:#A2834F;
  --bg:#0F1511; --surface:#18201B; --ink:#EAF0EA; --muted:#A0AEA5; --line:#2B362E;
  --danger:#F2B8B5;
  --b1:#7FA8EC; --b1t:#1C2940; --b2:#F0857F; --b2t:#3A1E1C; --b3:#F09AC2; --b3t:#3A1F2C;
  --b4:#55B874; --b4t:#1C3323; --b5:#F3A04A; --b5t:#3A2A15;
  color-scheme:dark;
}
:root{box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0; background:var(--bg); color:var(--ink)}
body{font-family:var(--font); font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--surface)}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tarp); outline-offset:2px}
.hidden{display:none !important}
.muted{color:var(--muted)}

#app{max-width:560px; margin:0 auto; min-height:100%; position:relative}
h1,h2,h3{line-height:1.2; margin:0}
h2{font-size:1.2rem; font-weight:700; margin:28px 0 12px}
h3{font-size:1.05rem; font-weight:700}
p{margin:0 0 10px}

/* Header */
.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:6px; padding:10px 10px 10px 12px; background:var(--surface); border-bottom:1px solid var(--line); min-height:60px}
.bar h1{flex:1; min-width:0; font-size:1.1rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:4px}
.iconbtn{width:44px; height:44px; border-radius:50%; border:0; background:transparent; display:grid; place-items:center; flex:none}
.iconbtn:active{background:var(--line)}
.pill{border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 12px; font-size:.84rem; font-weight:600; flex:none; min-height:38px}
.pill.lang{padding:7px 10px}
.content{padding:16px 16px calc(100px + env(safe-area-inset-bottom,0px))}
.content > h2:first-child{margin-top:4px}

/* Tab bar */
.tabs{position:fixed; left:0; right:0; bottom:0; z-index:6; max-width:560px; margin:0 auto; display:grid; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 2px 10px; font-size:.74rem; line-height:1.2; color:var(--muted); position:relative}
.tab .ti{font-size:1.4rem; line-height:1.1; filter:grayscale(.7); opacity:.75}
.tab[aria-current="page"]{color:var(--leaf); font-weight:700}
.tab[aria-current="page"] .ti{filter:none; opacity:1}
.badge{position:absolute; top:4px; left:calc(50% + 8px); min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:var(--b2); color:#fff; font-size:.72rem; font-weight:700; display:grid; place-items:center}

/* Buttons */
.btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:54px; padding:12px 18px; border-radius:14px; border:2px solid var(--line); background:var(--surface); font-weight:600; text-decoration:none; color:var(--ink); text-align:center}
.btn.primary{background:var(--leaf); border-color:var(--leaf); color:var(--on-leaf)}
.btn.danger{color:var(--danger); border-color:transparent; background:transparent}
.btn + .btn{margin-top:10px}
.btn.big{min-height:78px; justify-content:flex-start; text-align:left; font-size:1.15rem; padding:14px 18px}
.btn.big .bi{font-size:1.8rem}
.btn.big small{display:block; font-weight:400; font-size:.9rem; opacity:.85}
.link{border:0; background:none; color:var(--muted); text-decoration:underline; padding:10px; font-size:.9rem}

/* Cardboard price tags */
.tag{display:inline-block; font-weight:700; letter-spacing:-.01em; background:var(--board); color:var(--board-ink); padding:5px 10px 4px; border-radius:3px 7px 4px 6px; transform:rotate(var(--r,-2deg)); box-shadow:inset 0 0 0 1px var(--board-edge), 1px 2px 0 rgba(0,0,0,.14); font-size:1.1rem; line-height:1.05; white-space:nowrap; text-align:center; flex:none}
.tag small{display:block; font-size:.68rem; font-weight:500; opacity:.8; margin-top:2px}

/* Awning */
.awning{position:relative; height:70px; background:repeating-linear-gradient(90deg, var(--a1,var(--tarp)) 0 44px, var(--awn-alt) 44px 88px)}
.awning::after{content:""; position:absolute; left:0; right:0; top:100%; height:22px;
  background:
   radial-gradient(circle at 22px 0, var(--a1,var(--tarp)) 21.5px, transparent 22.5px) 0 0/88px 22px repeat-x,
   radial-gradient(circle at 66px 0, var(--awn-alt) 21.5px, transparent 22.5px) 0 0/88px 22px repeat-x}
.awning.sm{height:34px}
.awning.b1{--a1:var(--b1)} .awning.b2{--a1:var(--b2)} .awning.b3{--a1:var(--b3)} .awning.b4{--a1:var(--b4)} .awning.b5{--a1:var(--b5)}

/* Welcome */
.welcome{min-height:100vh; display:flex; flex-direction:column}
.welcome-in{padding:44px 22px 32px; flex:1; display:flex; flex-direction:column}
.place{color:var(--muted); font-size:.95rem; margin-bottom:8px}
.brandmark{width:76px; height:76px; display:block; margin:0 0 18px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.hmark{width:28px; height:28px; flex:none; border-radius:7px}
.bar h1.withmark{display:flex; align-items:center; gap:9px}
.brand{font-size:clamp(2.5rem, 12vw, 3.5rem); font-weight:800; letter-spacing:-.025em; line-height:.95; color:var(--leaf); margin-bottom:14px}
.lede{font-size:1.1rem; max-width:30ch; margin-bottom:26px}
.welcome .btn.big + .btn.big{margin-top:12px}
.welcome .foot{margin-top:auto; padding-top:24px; display:flex; flex-direction:column; align-items:center}
.langseg{position:relative; display:inline-grid; grid-template-columns:1fr 1fr; background:var(--line); border-radius:12px; padding:4px; margin:0 0 26px; align-self:flex-start}
.lang-ind{position:absolute; top:4px; bottom:4px; left:4px; width:calc(50% - 4px); border-radius:9px; background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.12); transform:translateX(var(--x,0))}
.langseg[data-l="tl"]{--x:100%}
.langseg.slide[data-l="tl"] .lang-ind{animation:slideToR .38s cubic-bezier(.3,.9,.3,1) both}
.langseg.slide[data-l="en"] .lang-ind{animation:slideToL .38s cubic-bezier(.3,.9,.3,1) both}
.langseg button{position:relative; z-index:1; border:0; background:transparent; border-radius:9px; min-height:42px; padding:0 18px; font-weight:600; color:var(--muted); transition:color .25s ease}
.langseg button[aria-pressed="true"]{color:var(--ink)}
.langlabel{font-size:.85rem; color:var(--muted); margin-bottom:6px}

/* Home */
.hello{font-size:1.25rem; font-weight:600; margin:2px 0 14px}
.search{display:flex; align-items:center; gap:8px; background:var(--surface); border:2px solid var(--line); border-radius:14px; padding:0 14px; min-height:54px}
.search:focus-within{border-color:var(--leaf)}
.search input[type=search]{flex:1; border:0; padding:0; border-radius:0; background:transparent; min-height:50px; outline:none; font-size:1rem}
.cats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px 6px}
.cat{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; min-height:124px; gap:7px; font-size:.8rem; font-weight:500; line-height:1.2; text-align:center; padding:2px}
.bowl{width:66px; height:66px; border-radius:50%; display:grid; place-items:center; font-size:1.85rem; background:var(--h); box-shadow:inset 0 0 0 5px rgba(255,255,255,.32), inset 0 -7px 0 rgba(0,0,0,.14)}
.b1{--h:var(--b1); --t:var(--b1t)} .b2{--h:var(--b2); --t:var(--b2t)} .b3{--h:var(--b3); --t:var(--b3t)} .b4{--h:var(--b4); --t:var(--b4t)} .b5{--h:var(--b5); --t:var(--b5t)}
.stalls{display:flex; gap:12px; overflow-x:auto; margin:0 -16px; padding:2px 16px 8px; scroll-snap-type:x mandatory}
.stall-card{flex:0 0 190px; scroll-snap-align:start; border:1.5px solid var(--line); background:var(--surface); border-radius:6px 6px 16px 16px; padding:0 0 14px; text-align:left; overflow:hidden; display:flex; flex-direction:column}
.stall-card .awning{height:18px; background:repeating-linear-gradient(90deg, var(--a1) 0 22px, var(--awn-alt) 22px 44px)}
.stall-card .awning::after{height:10px; background:
   radial-gradient(circle at 11px 0, var(--a1) 10.5px, transparent 11px) 0 0/44px 10px repeat-x,
   radial-gradient(circle at 33px 0, var(--awn-alt) 10.5px, transparent 11px) 0 0/44px 10px repeat-x}
.sc-emoji{font-size:2rem; padding:16px 14px 4px}
.stall-card b{padding:0 14px; font-size:.98rem; line-height:1.25}
.stall-card span.loc{padding:4px 14px 0; font-size:.82rem; color:var(--muted)}

/* Product list */
.plist{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; overflow:hidden}
.prod{display:grid; grid-template-columns:50px minmax(0,1fr) auto; gap:12px; align-items:center; padding:14px; border-top:1px solid var(--line)}
.prod:first-child{border-top:0}
.basin{width:50px; height:50px; border-radius:50%; display:grid; place-items:center; font-size:1.6rem; background:var(--t); box-shadow:inset 0 0 0 3px var(--h)}
.pinfo{min-width:0}
.pinfo b{display:block; font-weight:600; line-height:1.25}
.pinfo span{display:block; font-size:.88rem; color:var(--muted)}
.side{display:flex; flex-direction:column; align-items:flex-end; gap:9px}
.stalllink{border:0; background:none; padding:2px 0 0; font-size:.84rem; color:var(--leaf); font-weight:500; text-align:left; text-decoration:underline; text-underline-offset:2px}
.add{width:46px; height:46px; border-radius:50%; border:0; background:var(--leaf); color:var(--on-leaf); font-size:1.6rem; font-weight:600; line-height:1; display:grid; place-items:center}
.stepper{display:inline-flex; align-items:center; border:2px solid var(--leaf); border-radius:999px; overflow:hidden; background:var(--surface)}
.stepper button{width:36px; height:40px; border:0; background:transparent; font-size:1.3rem; font-weight:600; color:var(--leaf); flex:none}
.stepper input.qty{width:50px; min-height:40px; height:40px; padding:0; border:0; border-left:1px solid var(--line); border-right:1px solid var(--line); border-radius:0; background:transparent; text-align:center; font-weight:700; font-size:1rem; -moz-appearance:textfield; appearance:textfield}
.stepper input.qty::-webkit-outer-spin-button,.stepper input.qty::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.stepper input.qty:focus{background:var(--leaf-2); outline:none}
.prod.sold .basin,.prod.sold .pinfo,.prod.sold .tag{opacity:.55}
.prod.sold .tag{text-decoration:line-through}
.soldtxt{font-size:.82rem; font-weight:600; color:var(--muted)}
.prebtn{border:2px solid var(--b3); background:var(--b3t); color:var(--ink); border-radius:999px; padding:7px 12px; font-size:.82rem; font-weight:600; min-height:40px; white-space:nowrap}
.linetotal{font-weight:700; margin-top:2px; display:block; color:var(--ink) !important}
.qtyhint{font-size:.82rem; color:var(--muted); margin:-4px 0 12px}

/* Stall page */
.stall-hero{background:var(--surface); border:1.5px solid var(--line); border-radius:8px 8px 20px 20px; overflow:hidden; margin-bottom:6px}
.stall-hero .awning::after{height:16px; background:
   radial-gradient(circle at 22px 0, var(--a1) 21.5px, transparent 22.5px) 0 0/88px 16px repeat-x,
   radial-gradient(circle at 66px 0, var(--awn-alt) 21.5px, transparent 22.5px) 0 0/88px 16px repeat-x}
.sh-in{padding:28px 18px 18px}
.sh-emoji{font-size:2.8rem; line-height:1; margin-bottom:10px}
.sh-in h2{margin:0 0 6px; font-size:1.45rem}

/* Forms */
.field{margin:0 0 14px}
.field label,.flabel{display:block; font-weight:600; margin-bottom:6px}
input[type=text],input[type=tel],input[type=number],input[type=search],textarea,select{width:100%; min-height:52px; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--surface); font-size:1rem}
textarea{min-height:80px; resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--leaf); outline:none}
.choice{display:flex; align-items:center; gap:14px; border:2px solid var(--line); border-radius:14px; padding:14px; margin-bottom:10px; background:var(--surface); cursor:pointer}
.choice input{width:22px; height:22px; accent-color:var(--leaf); flex:none}
.choice b{display:block}
.choice small{display:block; color:var(--muted); font-size:.88rem}
.choice:has(input:checked){border-color:var(--leaf); background:var(--leaf-2)}
.choice:has(input:disabled){opacity:.5; cursor:not-allowed}
.two{display:grid; grid-template-columns:1fr; gap:0}
.prebox{background:var(--b3t); border:2px solid var(--b3); border-radius:14px; padding:14px; margin:4px 0 14px}
.prebox .field:last-child{margin-bottom:0}
.totals{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin:20px 0 12px}
.totals div{display:flex; justify-content:space-between; gap:12px; padding:3px 0}
.totals div > span:last-child{white-space:nowrap; text-align:right}
.totals .grand{font-weight:700; font-size:1.15rem; border-top:1px dashed var(--line); margin-top:6px; padding-top:10px}
.totals .minus{color:var(--danger)}
.totals .keep{font-weight:700; color:var(--leaf); font-size:1.1rem}
.note{font-size:.88rem; color:var(--muted)}
.err{color:var(--danger); font-size:.9rem; font-weight:600; margin-top:6px}
.emojis{display:grid; grid-template-columns:repeat(8,1fr); gap:6px}
.emojis label{position:relative; display:grid; place-items:center; aspect-ratio:1; border:2px solid var(--line); border-radius:12px; font-size:1.4rem; cursor:pointer; background:var(--surface); margin:0}
.emojis input{position:absolute; opacity:0}
.emojis label:has(input:checked){border-color:var(--leaf); background:var(--leaf-2)}
.emojis label:has(input:focus-visible){outline:3px solid var(--tarp)}

/* Orders */
.orow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:transparent; padding:14px 16px}
.orow:first-child{border-top:0}
.orow b{font-weight:600}
.orow .r{text-align:right}
.orow small{color:var(--muted); font-size:.85rem; display:block}
.chip{display:inline-block; padding:3px 10px; border-radius:999px; font-size:.78rem; font-weight:600; white-space:nowrap}
.chip + .chip{margin-left:4px}
.s0{background:var(--b1t); color:var(--b1)} .s1{background:var(--b5t); color:var(--ink)} .s2{background:var(--leaf-2); color:var(--leaf)} .s3{background:var(--line); color:var(--muted)}
.chip.pre{background:var(--b3t); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--b3)}
.steps{list-style:none; padding:0; margin:20px 0 6px; position:relative}
.steps li{position:relative; padding:0 0 18px 38px; color:var(--muted)}
.steps li::before{content:""; position:absolute; left:10px; top:22px; bottom:-2px; width:3px; background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{position:absolute; left:2px; top:2px; width:20px; height:20px; border-radius:50%; border:3px solid var(--line); background:var(--surface)}
.steps li.on{color:var(--ink)}
.steps li.on .dot{border-color:var(--leaf); background:var(--leaf)}
.steps li.on:not(.now)::before{background:var(--leaf)}
.steps li.now{font-weight:700}
.steps li.now .dot{box-shadow:0 0 0 5px var(--leaf-2)}
.kv{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:6px 16px; margin:12px 0}
.kv div{display:flex; justify-content:space-between; gap:16px; padding:9px 0; border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right; font-weight:500}
.seg{display:grid; background:var(--line); border-radius:12px; padding:4px; margin-bottom:14px}
.seg button{border:0; background:transparent; border-radius:9px; min-height:42px; font-weight:600; color:var(--muted); font-size:.92rem; padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.schedbanner{background:var(--b3t); border-radius:14px; padding:12px 14px; margin:12px 0; font-weight:600; box-shadow:inset 0 0 0 1.5px var(--b3)}
.schedbanner small{display:block; font-weight:400; color:var(--muted)}

/* Vendor */
.switchcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:6px}
.switchcard .e{font-size:1.9rem; flex:none}
.switchcard .n{flex:1; min-width:0}
.switchcard .n b{display:block; line-height:1.25}
.switchcard .n small{color:var(--muted); font-size:.85rem}
.switchcard .sw{flex:none; font-size:.85rem; font-weight:600; color:var(--leaf); border:1.5px solid var(--leaf); border-radius:999px; padding:6px 12px}
.stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:16px}
.stat{background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column}
.stat b{font-size:1.6rem; font-weight:700; line-height:1.1}
.stat span{font-size:.8rem; color:var(--muted); line-height:1.3; margin-top:2px}
.salesboard{grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--leaf-2); border-color:transparent; flex-direction:row; padding:16px}
.salesboard .tag{font-size:1.8rem; padding:8px 16px 6px}
.salesboard p{margin:0; font-weight:600}
.salesboard small{display:block; font-weight:400; color:var(--muted); font-size:.85rem; margin-top:4px}
.switch{position:relative; display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:.8rem; color:var(--muted)}
.switch input{position:absolute; opacity:0; width:52px; height:30px; margin:0}
.track{width:52px; height:30px; border-radius:999px; background:var(--line); position:relative; transition:background .2s; flex:none}
.track::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s}
.switch input:checked + .track{background:var(--leaf)}
.switch input:checked + .track::after{transform:translateX(22px)}
.switch input:focus-visible + .track{outline:3px solid var(--tarp); outline-offset:2px}
.editbtn{border:0; background:none; color:var(--leaf); font-weight:600; text-decoration:underline; font-size:.88rem; padding:4px 0}

/* Owner */
.owner-hero{background:var(--leaf); color:var(--on-leaf); border-radius:18px; padding:18px; margin-bottom:14px}
.owner-hero p{margin:0; opacity:.9}
.owner-hero .big{font-size:2.2rem; font-weight:800; letter-spacing:-.02em; line-height:1.1; margin:4px 0}
.ownrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; padding:12px 16px; border-top:1px solid var(--line)}
.ownrow:first-child{border-top:0}
.ownrow small{color:var(--muted); font-size:.85rem}
.ownrow .r{text-align:right}
.proj{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:16px}
.proj .out{background:var(--board); color:var(--board-ink); border-radius:12px; padding:14px; margin-top:4px; font-weight:600}
.proj .out b{display:block; font-size:1.7rem; font-weight:800; line-height:1.15}

/* Tour */
.tour{list-style:none; padding:0; margin:0}
.tour li{background:var(--surface); border:1.5px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px}
.tour .top{display:flex; gap:14px; align-items:flex-start; margin-bottom:8px}
.tour .top .basin{flex:none}
.tour .top div{flex:1}
.tour h3{margin:2px 0 2px}
.tips{background:var(--b5t); border-radius:18px; padding:16px 18px; margin-top:20px}
.tips ul{margin:8px 0 0; padding-left:20px}
.tips li{margin-bottom:6px}

.empty{text-align:center; padding:36px 10px}
.empty .big{font-size:3rem; margin-bottom:8px}
.done{text-align:center; padding:24px 4px 0}
.done .tag{font-size:2rem; padding:10px 22px 8px; margin-bottom:22px}
.done h2{margin:0 0 6px; font-size:1.5rem}
.done .plist{text-align:left; margin:20px 0}

.toast{position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); background:var(--ink); color:var(--bg); padding:11px 20px; border-radius:999px; font-size:.95rem; font-weight:500; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; max-width:calc(100% - 32px); text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:370px){
  .cats{grid-template-columns:repeat(3,1fr)}
  .basin{width:44px; height:44px; font-size:1.4rem}
  .prod{grid-template-columns:44px minmax(0,1fr) auto; gap:10px}
  .stats{grid-template-columns:1fr 1fr}
}


/* ---------- Messaging ---------- */
.content.nochrome{padding-bottom:0; display:flex; flex-direction:column; min-height:calc(100vh - 61px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); min-height:calc(100dvh - 61px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.content.nochrome .chat{flex:1; min-height:0}
.chathead{display:flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:10px 14px; margin-bottom:14px}
.chathead .e{font-size:1.7rem}
.chathead b{display:block; line-height:1.25}
.chathead small{color:var(--muted); font-size:.82rem}
.chat{display:flex; flex-direction:column; gap:8px; min-height:40vh; padding-bottom:6px}
.msg{max-width:82%; padding:10px 14px; border-radius:18px; line-height:1.38; font-size:.98rem; overflow-wrap:anywhere}
.msg.me{align-self:flex-end; background:var(--leaf); color:var(--on-leaf); border-bottom-right-radius:6px}
.msg.them{align-self:flex-start; background:var(--surface); border:1.5px solid var(--line); border-bottom-left-radius:6px}
.msg time{display:block; font-size:.72rem; opacity:.75; margin-top:3px}
.chatempty{color:var(--muted); text-align:center; margin:auto 0; padding:30px 10px; font-size:.95rem}
.composer{position:sticky; bottom:0; background:var(--bg); margin:0 -16px; padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); z-index:4}
.quick{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px}
.quick button{flex:none; border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:8px 14px; font-size:.85rem; font-weight:500}
.composer form{display:flex; gap:8px}
.composer input[type=text]{flex:1; border-radius:999px; min-height:48px}
.composer button.sendbtn{border:0; border-radius:999px; background:var(--leaf); color:var(--on-leaf); font-weight:700; padding:0 20px; min-height:48px; flex:none}
.unread{display:inline-grid; place-items:center; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:var(--b2); color:#fff; font-size:.75rem; font-weight:700}
/* ---------- Registration and city records ---------- */
.notice{background:var(--b5t); border-radius:16px; padding:14px 16px; margin:0 0 14px; box-shadow:inset 0 0 0 1.5px var(--b5)}
.notice b{display:block; margin-bottom:4px}
.notice p{margin:0; font-size:.92rem}
.fsection{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:16px 16px 4px; margin-bottom:14px}
.fsection h3{margin-bottom:12px}
.req{color:var(--danger)}
.checkline{display:flex; align-items:center; gap:12px; font-weight:600; margin:6px 0 14px}
.checkline input{width:22px; height:22px; accent-color:var(--leaf)}
.rec{background:var(--surface); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:12px}
.rec .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.rec .top b{font-size:1.05rem}
.rec dl{display:grid; grid-template-columns:auto 1fr; gap:3px 12px; margin:10px 0; font-size:.88rem}
.rec dt{color:var(--muted)} .rec dd{margin:0; font-weight:500}
.rec .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px}
.rec .acts .btn{width:auto; min-height:44px; padding:8px 16px; font-size:.9rem; flex:1}
.chip.pend{background:var(--b5t); color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--b5)}
.chip.ok{background:var(--leaf-2); color:var(--leaf)}
.chip.unpaid{background:var(--b2t); color:var(--ink)}

/* ---------- Motion ---------- */
@keyframes inFwd{from{opacity:0; transform:translateX(18px)} to{opacity:1; transform:none}}
@keyframes inBack{from{opacity:0; transform:translateX(-18px)} to{opacity:1; transform:none}}
@keyframes inUp{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@keyframes pop{0%{transform:scale(.75); opacity:.4} 60%{transform:scale(1.06); opacity:1} 100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)} 40%{transform:scale(1.35)} 100%{transform:scale(1)}}
@keyframes drop{from{transform:scaleY(.2); opacity:.6} to{transform:none; opacity:1}}
@keyframes reveal{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
@keyframes tagIn{0%{opacity:0; transform:translateY(-24px) rotate(-12deg)} 70%{opacity:1; transform:translateY(3px) rotate(-1deg)} 100%{transform:rotate(-3deg)}}
@keyframes slideToR{from{transform:translateX(0)} to{transform:translateX(100%)}}
@keyframes slideToL{from{transform:translateX(100%)} to{transform:translateX(0)}}
@keyframes langIn{from{opacity:.15} to{opacity:1}}
/* Fallback for browsers without View Transitions: quick fade out, swap, fade in */
#app{transition:opacity .14s ease}
#app.lang-out{opacity:.15}
.welcome.relang .welcome-in > :not(.langseg),
.content.a-lang, .tabs.a-lang .tab, .bar.a-lang h1, .bar.a-lang .pill{animation:langIn .26s ease-out both}
/* View Transitions: the browser crossfades old and new text and morphs sizes */
/* Simultaneous crossfade: anything that doesn't change stays perfectly still, only the words dissolve */
::view-transition-group(*){animation-duration:.34s; animation-timing-function:cubic-bezier(.3,.9,.3,1)}
::view-transition-old(*),::view-transition-new(*),::view-transition-old(root),::view-transition-new(root){animation-duration:.34s; animation-timing-function:cubic-bezier(.4,0,.2,1)}
::view-transition-old(w-seg){animation:none; opacity:0}
::view-transition-new(w-seg){animation:none; opacity:1}
.welcome .place{view-transition-name:w-place}
 .welcome .langseg{view-transition-name:w-seg} .welcome .lede{view-transition-name:w-lede}
.welcome .langlabel{view-transition-name:w-label}
.welcome .btn.primary{view-transition-name:w-buy} .welcome .btn.big:not(.primary){view-transition-name:w-sell}
.welcome .foot{view-transition-name:w-foot}
.bar h1{view-transition-name:bar-title} .bar .pill.lang{view-transition-name:bar-lang} .bar .pill:not(.lang){view-transition-name:bar-mode}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--leaf)} 100%{box-shadow:0 0 0 12px transparent}}

.content.a-fwd{animation:inFwd .28s cubic-bezier(.2,.8,.2,1) both}
.content.a-back{animation:inBack .28s cubic-bezier(.2,.8,.2,1) both}
.content.a-tab{animation:inUp .25s ease-out both}
.content[class*="a-"] .plist > *:nth-child(-n+8){animation:rise .35s ease-out both}
.content[class*="a-"] .plist > *:nth-child(2){animation-delay:.04s}
.content[class*="a-"] .plist > *:nth-child(3){animation-delay:.08s}
.content[class*="a-"] .plist > *:nth-child(4){animation-delay:.12s}
.content[class*="a-"] .plist > *:nth-child(5){animation-delay:.16s}
.content[class*="a-"] .plist > *:nth-child(6){animation-delay:.2s}
.content[class*="a-"] .plist > *:nth-child(7){animation-delay:.24s}
.content[class*="a-"] .plist > *:nth-child(8){animation-delay:.28s}
.content[class*="a-"] .bowl{animation:pop .4s ease-out both}

.welcome.animate > .awning{transform-origin:top; animation:drop .45s cubic-bezier(.2,.8,.2,1) both}

.welcome.animate .welcome-in > *:nth-child(2){animation-delay:.06s} .welcome.animate .welcome-in > *:nth-child(3){animation-delay:.12s}

.btn,.add,.cat,.stall-card,.orow,.prebtn,.switchcard,.pill,.tab,.stepper button,.iconbtn,.seg button,.langseg button{transition:transform .12s ease, background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease}
.btn:active,.prebtn:active,.switchcard:active,.pill:active{transform:scale(.97)}
.add:active,.stepper button:active,.iconbtn:active{transform:scale(.88)}
.cat:active,.stall-card:active{transform:scale(.95)}
.orow:active{background:var(--leaf-2)}
.tab:active .ti{transform:scale(.85)}
.tab .ti{transition:transform .15s ease, filter .2s ease, opacity .2s ease}
.tab[aria-current="page"] .ti{transform:translateY(-1px)}
.choice{transition:border-color .2s ease, background-color .2s ease}

.pop{animation:pop .3s ease-out both}
.badge.bump{animation:bump .4s ease-out}
.prebox:not(.hidden),#addrField:not(.hidden){animation:reveal .25s ease-out both}
.done .tag{animation:tagIn .6s cubic-bezier(.2,.8,.2,1) both}
.done > :not(.tag){animation:rise .4s ease-out .15s both}
.steps li.now.fresh .dot{animation:pulse .7s ease-out 2}
.err:not(.hidden){animation:reveal .2s ease-out both}

const idNum = id => parseInt(String(id).replace(/\D/g, ''), 10) || 0;
const plain = o => JSON.parse(JSON.stringify(o));
function toRemote(col, item){
  const o = plain(item);
  if (col === 'threads'){ const m = {}; (item.msgs || []).forEach(x => { m[x.k] = {f:x.f, t:x.t, ts:x.ts}; }); o.msgs = m; }
  return o;
}
function fromRemote(col, map){
  const arr = Object.keys(map || {}).map(k => map[k]).filter(Boolean);
  arr.forEach(x => {
    if (col === 'threads'){
      const m = x.msgs || {};
      x.msgs = Object.keys(m).map(k => Object.assign({k}, m[k])).sort((a, b) => a.ts - b.ts);
      x.ub = x.ub || 0; x.uv = x.uv || 0;
    }
    if (col === 'orders'){ if (x.sched === undefined) x.sched = null; x.items = x.items || []; }
    if (col === 'vendors'){ x.story = x.story || {en:'', tl:''}; }
  });
  if (col === 'products' || col === 'vendors') arr.sort((a, b) => idNum(a.id) - idNum(b.id));
  if (col === 'orders') arr.sort((a, b) => a.createdAt - b.createdAt);
  return arr;
}
const stable = v => Array.isArray(v) ? '[' + v.map(stable).join(',') + ']' : (v && typeof v === 'object') ? '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}' : JSON.stringify(v === undefined ? null : v);
const keyOf = item => stable(plain(item));
function seedPayload(){
  const out = {seq: 1040, meta: {seededAt: Date.now()}};
  const data = {products: clone(SEED_PRODUCTS), orders: seedOrders(), vendors: clone(SEED_VENDORS), threads: seedThreads()};
  COLS.forEach(c => { out[c] = {}; data[c].forEach(it => { out[c][it.id] = toRemote(c, it); }); });
  return out;
}
function syncPush(){
  if (!SYNC.db || !SYNC.ready) return;
  const up = {};
  COLS.forEach(col => {
    const prev = SYNC.synced[col], seen = {};
    S[col].forEach(item => {
      seen[item.id] = 1;
      const now = keyOf(item);
      if (prev[item.id] === now) return;
      if (col === 'threads' && prev[item.id]){
        const old = JSON.parse(prev[item.id]); const base = ROOT + '/threads/' + item.id;
        ['vid', 'bk', 'bname', 'ub', 'uv'].forEach(f => { if (old[f] !== item[f]) up[base + '/' + f] = item[f] == null ? null : item[f]; });
        const had = {}; (old.msgs || []).forEach(m => { had[m.k] = 1; });
        item.msgs.forEach(m => { if (!had[m.k]) up[base + '/msgs/' + m.k] = {f:m.f, t:m.t, ts:m.ts}; });
      } else {
        up[ROOT + '/' + col + '/' + item.id] = toRemote(col, item);
      }
      prev[item.id] = now;
    });
    Object.keys(prev).forEach(id => { if (!seen[id]){ up[ROOT + '/' + col + '/' + id] = null; delete prev[id]; } });
  });
  if (Object.keys(up).length) SYNC.db.ref().update(up).catch(e => console.warn('Sync failed', e));
}
function applyRemote(val){
  let changed = false;
  COLS.forEach(col => {
    const arr = fromRemote(col, val[col]);
    const map = {}; arr.forEach(it => { map[it.id] = keyOf(it); });
    const cur = {}; S[col].forEach(it => { cur[it.id] = keyOf(it); });
    const a = Object.keys(map), b = Object.keys(cur);
    if (a.length !== b.length || a.some(id => map[id] !== cur[id])) { S[col] = arr; changed = true; }
    SYNC.synced[col] = map;
  });
  if (typeof val.seq === 'number' && val.seq > S.seq) S.seq = val.seq;
  saveLocal();
  if (changed) remoteRender();
}

function startSync(){
  if (!window.firebase || !firebase.database){ console.warn('Firebase not loaded; running on this phone only'); return; }
  try {
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    SYNC.db = app.database();
  } catch (e){ console.warn('Firebase init failed', e); return; }
  SYNC.db.ref('.info/connected').on('value', snap => {
    SYNC.online = !!snap.val();
    const el = document.getElementById('syncStatus'); if (el) el.textContent = SYNC.online ? '● ' + t('syncLive') : '○ ' + t('syncOff');
  });
  SYNC.db.ref(ROOT).on('value', snap => {
    const val = snap.val();
    if (!val || !val.meta){ SYNC.db.ref(ROOT).set(seedPayload()); return; }
    SYNC.ready = true;
    applyRemote(val);
  }, err => console.warn('Sync listener error', err));
}
function allocOrderIds(count){
  const local = () => { const ids = []; for (let i = 0; i < count; i++){ S.seq++; ids.push('MLS-' + S.seq + (SYNC.db ? '-' + ME.slice(-3).toUpperCase() : '')); } return ids; };
  if (!SYNC.db || !SYNC.online) return Promise.resolve(local());
  const tx = SYNC.db.ref(ROOT + '/seq').transaction(n => (n || 1040) + count).then(r => {
    if (!r.committed) return local();
    const end = r.snapshot.val(); S.seq = Math.max(S.seq, end);
    const ids = []; for (let i = end - count + 1; i <= end; i++) ids.push('MLS-' + i); return ids;
  });
  const timeout = new Promise(res => setTimeout(() => res(null), 4000));
  return Promise.race([tx, timeout]).then(r => r || local()).catch(() => local());
}

/* ================= Language switching ================= */
let langBusy = false;
function switchLang(l){
  if (l === S.lang || langBusy) return;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const apply = mode => { S.lang = l; S.anim = mode; save(); render(); };
  if (reduce){ apply(null); return; }
  if (document.startViewTransition){
    langBusy = true;
    const vt = document.startViewTransition(() => apply('lang-vt'));
    vt.finished.finally(() => { langBusy = false; });
    return;
  }
  // Fallback: brief fade out, swap the words, fade back in
  langBusy = true;
  $app.classList.add('lang-out');
  setTimeout(() => { apply('lang'); $app.classList.remove('lang-out'); langBusy = false; }, 140);
}

function setQty(pid, q){
  const p = prod(pid); if (!p) return;
  q = isWeight(p.unit) ? round2(q) : Math.round(q);
  if (q > 999) q = 999;
  const b = basketItem(pid);
  if (!(q > 0)){ S.basket = S.basket.filter(x => x.pid !== pid); }
  else if (b){ b.qty = q; }
  else S.basket.push({pid, qty:q});
  save(); render();
}
function changeQty(pid, delta){
  const q = qtyOf(pid) + delta;
  setQty(pid, q < 0 ? 0 : q);
}

  chatc(d){
    const o = S.orders.find(x => x.id === d.id); if (!o) return;
    const th = threadFor(o.vid, o.buyerId || slug(o.customer), o.customer);
    go('chat', {tid:th.id, pre: t('aboutOrder', o.id)});
  },
  openchat(d){ go('chat', {tid:d.tid}); },
  quick(d){ const i = document.getElementById('msgInput'); if (i){ i.value = d.text; i.focus(); } },
  cfilter(d){ cur().params.f = d.f; S.anim = 'tab'; render(); },
  markpaid(d){ const v = vendor(d.vid); if (!v) return; v.feePaid = true; save(); render(); toast(t('feeMarked')); },
  verifyv(d){
    const v = vendor(d.vid); if (!v) return;
    if (!v.feePaid){ toast(t('verifyNeedsFee')); return; }
    v.status = 'verified'; save(); render(); toast(t('nowLive', v.name));
  },
  cat(d){ go('category', {id:d.id}); },
  stall(d){ go('stall', {vid:d.vid}); },
  add(d){ const p = prod(d.pid); S.popPid = d.pid; S.bumpBadge = !qtyOf(d.pid); changeQty(d.pid, 1); toast(p && p.soldOut ? t('addedPre') : t('added')); },
  inc(d){ changeQty(d.pid, 1); },
  dec(d){ changeQty(d.pid, -1); },
  order(d){ if (d.id) go(S.mode === 'vendor' ? 'vorder' : 'order', {id:d.id}); },
  advance(d){
    const o = S.orders.find(x => x.id === d.id); if (!o || o.status >= 3) return;
    o.status++; S.freshStep = o.id; save(); render(); toast(t('marked', statusLabel(o)));
  },
  vfilter(d){ cur().params.f = d.f; S.anim = 'tab'; render(); },
  newprod(){ go('vedit', {}); },
  editprod(d){ go('vedit', {pid:d.pid}); },
  delprod(d){
    if (!confirm(t('removeConfirm'))) return;
    S.products = S.products.filter(p => p.id !== d.pid);
    S.basket = S.basket.filter(b => b.pid !== d.pid);
    save(); back(); toast(t('removed'));
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (fn){ e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const tg = e.target;
  if (tg.id === 'search'){ S.query = tg.value; const r = document.getElementById('results'); if (r) r.innerHTML = homeResults(); }
  if (tg.id === 'pprice'){ const v = parseFloat(tg.value); document.getElementById('bpHint').textContent = v > 0 ? t('buyersSeeHint', peso(bprice({price:v}))) : ''; }
  if (tg.dataset && tg.dataset.proj){ S.proj[tg.dataset.proj] = Math.max(0, parseFloat(tg.value) || 0); save(); document.getElementById('projOut').innerHTML = projHTML(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('qty')){ e.preventDefault(); e.target.blur(); }
});
document.addEventListener('change', e => {
  const tg = e.target;
  if (tg.dataset && tg.dataset.qty){
    const v = parseFloat(String(tg.value).replace(',', '.'));
    if (isNaN(v)){ render(); return; }
    setQty(tg.dataset.qty, v); return;
  }
  if (tg.dataset && tg.dataset.change === 'avail'){
    const p = prod(tg.dataset.pid); if (p){ p.soldOut = !tg.checked; save(); render(); toast(p.soldOut ? t('nowSold', pName(p)) : t('backStock', pName(p))); }
  }
  if (tg.name === 'method'){
    const del = tg.value === 'delivery';
    document.getElementById('addrField').classList.toggle('hidden', !del);
    const fee = del ? 50 : 0, sub = basketSubtotal();
    document.getElementById('fee').textContent = peso(fee);
    document.getElementById('total').textContent = peso(sub + fee);
  }
  if (tg.name === 'when'){
    const later = tg.value === 'later';
    document.getElementById('preBox').classList.toggle('hidden', !later);
    document.getElementById('placeBtn').textContent = later ? t('placePre') : t('placeOrder');
  }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const fd = new FormData(f); const err = document.getElementById('formErr');
  const fail = msg => { err.textContent = msg; err.classList.remove('hidden'); err.scrollIntoView({block:'center', behavior:'smooth'}); };

  if (f.dataset.form === 'chat'){
    const text = String(fd.get('msg') || '').trim(); if (!text) return;
    const th = S.threads.find(x => x.id === f.dataset.tid); if (!th) return;
    const role = S.mode === 'vendor' ? 'v' : 'b';
    th.msgs.push({k: msgKey(), f:role, t:text, ts:Date.now()});
    if (role === 'b') th.uv++; else th.ub++;
    cur().params.pre = '';
    save(); render();
    const i = document.getElementById('msgInput'); if (i) i.focus();
    return;
  }

  if (f.dataset.form === 'vreg'){
    const g = k => String(fd.get(k) || '').trim();
    const owner = g('rOwner'), phone = g('rPhone'), license = g('rLicense'), no = g('rStallNo'), lease = g('rLease'), name = g('rName'), sec = g('rSec');
    if (!owner || !phone || !license || !no || !lease || !name || !sec) return fail(t('errReq'));
    if (S.vendors.some(v => String(v.no).toLowerCase() === no.toLowerCase())) return fail(t('errDupStall'));
    if (S.vendors.some(v => String(v.lease).toLowerCase() === lease.toLowerCase())) return fail(t('errDupLease'));
    const city = f.dataset.by === 'city', paid = city && !!fd.get('rPaid');
    const cat = CATS.find(c => c.id === sec) || CATS[0];
    const about = g('rAbout');
    const v = {id:'v' + Date.now(), name, first: owner.split(/\s+/)[0], owner, no, sec, emoji: cat.emoji, hue: cat.hue,
      open: g('rOpen') || '6:00 am', close: g('rClose') || '6:00 pm', story:{en: about, tl: about},
      phone, license, lease, status: city && paid ? 'verified' : 'pending', regBy: city ? 'city' : 'vendor', feePaid: paid, registeredAt: Date.now()};
    S.vendors.push(v);
    if (city){ save(); S.stack = [{view:'city', params:{}}]; render(); window.scrollTo(0, 0); toast(t('regCityDone')); }
    else { S.vid = v.id; save(); go('vhome', {}, true); toast(t('regDone')); }
    return;
  }

  if (f.dataset.form === 'checkout'){
    const method = fd.get('method'), pay = fd.get('pay');
    const later = fd.get('when') === 'later' || basketNeedsPre();
    const sched = later ? {date: fd.get('pdate'), slot: parseInt(fd.get('pslot'), 10) || 0} : null;
    const name = String(fd.get('cname') || '').trim(), phone = String(fd.get('phone') || '').trim(), address = String(fd.get('address') || '').trim();
    if (!name) return fail(t('errName'));
    if (method === 'delivery' && !address) return fail(t('errAddr'));
    const byV = {};
    S.basket.forEach(b => { const p = prod(b.pid); if (p && (later || !p.soldOut)) (byV[p.vid] = byV[p.vid] || []).push({pid:p.id, name:p.name, emoji:p.emoji, price:p.price, bp:bprice(p), unit:p.unit, qty:b.qty}); });
    const vids = Object.keys(byV);
    if (!vids.length) return fail(t('errEmpty'));
    const btn = f.querySelector('button[type=submit]'); if (btn){ if (btn.disabled) return; btn.disabled = true; }
    allocOrderIds(vids.length).then(newIds => {
      const ids = []; let first = true;
      vids.forEach((vid, i) => {
        const id = newIds[i];
        const base = round2(byV[vid].reduce((s, it) => s + it.price * it.qty, 0));
        const sub = round2(byV[vid].reduce((s, it) => s + it.bp * it.qty, 0));
        const fee = method === 'delivery' && first ? 50 : 0; first = false;
        S.orders.push({id, vid, items:byV[vid], method, pay, status:0, customer:name, phone, address, createdAt:Date.now(), base, subtotal:sub, appFee:round2(sub - base), fee, total:round2(sub + fee), buyerId:ME, sched});
        ids.push(id);
      });
      S.buyerName = name; S.threads.forEach(th => { if (th.bk === ME) th.bname = name; });
      S.basket = []; save();
      S.stack = [{view:'home', params:{}}]; go('done', {ids});
    });
  }

  if (f.dataset.form === 'product'){
    const name = String(fd.get('name') || '').trim(), price = parseFloat(fd.get('price'));
    if (!name) return fail(t('errPName'));
    if (!(price > 0)) return fail(t('errPPrice'));
    const data = {name, local:String(fd.get('local') || '').trim(), price:round2(price), unit:fd.get('unit'), cat:fd.get('cat'), emoji:fd.get('emoji') || '🛒'};
    const pid = f.dataset.pid;
    if (pid){
      const p = prod(pid);
      if (p.name !== data.name || p.local !== data.local){ delete p.tl; delete p.tlSub; }
      Object.assign(p, data);
    } else { S.products.push(Object.assign({id:'p' + Date.now(), vid:S.vid, soldOut:false}, data)); }
    save(); back(); toast(t('saved'));
  }
});

/* ================= Start ================= */
// Always open on the welcome screen, where people choose whether they're buying or selling.
S.mode = null; save();
S.stack = [{view:'welcome', params:{}}];
render();
startSync();
})();
</script>
</body>
